<!doctype html><html lang="es"><meta charset="utf-8"><title>ColorClik — QA puerta roja</title><style>body{margin:0;background:#ddd;font:14px system-ui}header{height:60px;display:flex;gap:16px;align-items:center;padding:0 20px}iframe{border:0;transform-origin:top left}input{width:400px}</style><header><button id="a">1440 × 900</button><button id="b">1920 × 1080</button><label>Historia <input id="p" type="number" min="0" max="10000" value="5500" step="1"></label><output id="v"></output></header><iframe id="f" src="story-test.html?v=71-final" width="1440" height="900"></iframe><script>
const f=document.querySelector('#f'),p=document.querySelector('#p'),v=document.querySelector('#v');function size(w,h){f.width=w;f.height=h;f.style.transform=`scale(${Math.min(1,(innerWidth-20)/w,(innerHeight-65)/h)})`;}
function seek(){const w=f.contentWindow,st=w.ScrollTrigger?.getAll()[0];if(st){w.scrollTo(0,st.start+(st.end-st.start)*(Number(p.value)<=6000?Number(p.value)/1000*150/1980:Number(p.value)<=7000?(900+(Number(p.value)/1000-6)*300)/1980:Number(p.value)<=8000?(1200+(Number(p.value)/1000-7)*180)/1980:(1380+(Number(p.value)/1000-8)*300)/1980));v.value=(p.value/1000).toFixed(3);}}
a.onclick=()=>size(1440,900);b.onclick=()=>size(1920,1080);p.oninput=seek;f.onload=()=>{size(1440,900);setTimeout(seek,1500)};
</script></html>
